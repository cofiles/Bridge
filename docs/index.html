<style>

.pg{display:none}
.pg.act{display:block}
.in.f{animation:inF .45s var(--e)}.in.b{animation:inB .45s var(--e)}

.btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border-radius:99px;font-weight:600;font-size:1rem;border:0;cursor:pointer;font-family:inherit;transition:border-radius .3s var(--e),transform .2s}
.btn:hover{border-radius:18px}.btn:active{transform:scale(.97)}
.fill{background:var(--p);color:var(--op)}.tonal{background:var(--sc);color:var(--osc)}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:12px}
h1{font-size:clamp(2.7rem,7.5vw,5.4rem);line-height:1;letter-spacing:-.035em;font-weight:800;margin:22px 0 20px}
.lead{color:var(--tv);font-size:1.15rem;max-width:30em}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 26px}
.plats{display:flex;flex-wrap:wrap;gap:8px}
.ready .ht>*{animation:rise .7s var(--e) both}
.ready .ht>:nth-child(2){animation-delay:.08s}.ready .ht>:nth-child(3){animation-delay:.16s}.ready .ht>:nth-child(4){animation-delay:.24s}.ready .ht>:nth-child(5){animation-delay:.32s}

@keyframes rise{from{opacity:0;transform:translateY(28px)}}
.lab{justify-self:center;width:100%;max-width:480px;background:var(--s1);border:1px solid var(--ol);border-radius:44px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px #0007}

.tx{fill:var(--t);font:600 13px Onest,sans-serif;pointer-events:none;text-anchor:middle}
.ts{fill:var(--tv);font:500 11px Onest,sans-serif;pointer-events:none;text-anchor:middle}
.core{fill:var(--pc);transition:fill .4s}.core.on{fill:var(--p)}

.ci{width:52px;height:52px;display:grid;place-items:center;background:var(--pc);color:var(--opc);border-radius:16px;margin-bottom:16px;transition:border-radius .4s var(--e)}

#osc{display:flex;gap:22px;align-items:flex-start;background:var(--s1);border-radius:36px;padding:30px;margin:22px 0 16px;max-width:720px;animation:pop .4s var(--e)}
#osc .big{font-size:56px;width:96px;height:96px;display:grid;place-items:center;background:var(--p);color:var(--op);border-radius:34px;flex:none;animation:morph 10s ease-in-out infinite}

.note .m{color:var(--p);flex:none}
/* guide */
.steps{list-style:none;padding:0;margin:0 0 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;counter-reset:s}

h4{font-size:1.4rem;margin:0 0 14px}

.brand{transition:transform .3s var(--e)}.brand:hover{transform:scale(1.04)}.brand:hover .lg{animation-duration:1.4s}

.nd{transition:fill .3s,stroke .3s,opacity .3s,transform .3s var(--e)}
.nd[data-n]{transform-box:fill-box;transform-origin:center}

.btn{height:52px;padding:0 22px}

</style>
</head>
