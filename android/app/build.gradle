plugins {
 id 'com.android.application'
 id 'com.chaquo.python'
}
android {
 namespace 'app.bridge'
 compileSdk 35
 defaultConfig {
  applicationId 'app.bridge.client'
  minSdk 26
  targetSdk 35
  versionCode 3
  versionName '1.1.0'
  ndk { abiFilters 'arm64-v8a' }
 }
 signingConfigs {
  release {
   if (System.getenv('BRIDGE_KEYSTORE')) {
    storeFile file(System.getenv('BRIDGE_KEYSTORE'))
    storePassword System.getenv('BRIDGE_STORE_PASSWORD')
    keyAlias System.getenv('BRIDGE_KEY_ALIAS')
    keyPassword System.getenv('BRIDGE_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   signingConfig signingConfigs.release
  }
 }
 sourceSets { main { assets.srcDirs = ['../../assets'] } }
 packaging { jniLibs { useLegacyPackaging = true } }
}
chaquopy {
 defaultConfig {
  version = '3.12'
  pip { install 'certifi' }
 }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
