<style>

</main><script>
const el=id=>document.getElementById(id);

let timerSeconds=0,timerAnchor=performance.now(),timerRunning=false;
function paintTimer(){
 const seconds=Math.floor(timerSeconds+(timerRunning?(performance.now()-timerAnchor)/1000:0));
 el('timer').textContent=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':');
}
function syncTimer(s){
 const elapsed=timerSeconds+(timerRunning?(performance.now()-timerAnchor)/1000:0);
 timerSeconds=s.active&&timerRunning?Math.max(elapsed,s.seconds||0):(s.seconds||0);
 timerRunning=!!s.active;timerAnchor=performance.now();paintTimer();
}
setInterval(paintTimer,250);

const originalText=new WeakMap();
function translated(text){
 let result=text;
 for(const [ru,en] of Object.entries(translations).sort((a,b)=>b[0].length-a[0].length))
  result=result.split(ru).join(en);
 return result;
}
function translatePage(){
 const walker=document.createTreeWalker(document.querySelector('main'),NodeFilter.SHOW_TEXT);
 let node;
 while(node=walker.nextNode()){
  // Server names and pasted data belong to the subscription.
  if(node.parentElement.closest('#nodes,#url'))continue;
  const previous=originalText.get(node);
  let source=node.nodeValue;
  if(previous && (source===previous.rendered || source===previous.source))source=previous.source;
  const rendered=language==='en'?translated(source):source;
  originalText.set(node,{source,rendered});
  if(node.nodeValue!==rendered)node.nodeValue=rendered;
 }
 if(!loaded && el('nodes').options.length){const text=language==='en'?'Load a subscription':'Загрузите подписку';if(el('nodes').options[0].text!==text)el('nodes').options[0].text=text;}
}
function setLanguage(name){

}
new MutationObserver(translatePage).observe(document.querySelector('main'),{subtree:true,childList:true,characterData:true});

 if(!api)return;
 const result=await api.language(el('language').value);

};
const colors={sage:['Шалфей',149],ocean:['Океан',210],lilac:['Сирень',271],clay:['Терракота',18],rose:['Роза',340],sand:['Песок',48]};
function applyPalette(id){

 document.documentElement.style.setProperty('--h',colors[id][1]);
 for(const b of el('colors').children){b.setAttribute('aria-pressed',String(b.dataset.id===id));b.lastChild.textContent=b.dataset.id===id?'✓':''}
}
for(const [id,[name,hue]] of Object.entries(colors)){

 b.append(swatch,name,check);b.onclick=async()=>{if(!api)return;const s=await api.palette(id);if(s.error)el('settingNote').textContent=s.error;else applyPalette(s.name)};el('colors').append(b);
}

function tab(settings){el('settings').hidden=!settings;el('home').hidden=settings;el('homeTab').setAttribute('aria-pressed',!settings);el('settingsTab').setAttribute('aria-pressed',settings)}
el('homeTab').onclick=()=>tab(false);el('settingsTab').onclick=()=>tab(true);
function controls(){el('url').disabled=el('load').disabled=el('paste').disabled=busy||active||connecting;el('nodes').disabled=busy||active||connecting||!loaded;el('action').disabled=busy||(!loaded&&!active&&!connecting)}
function render(s){
 connecting=!!(s.connecting||s.reconnecting);
 if(typeof s.active==='boolean'){

 let n=s.bytes,i=0,units=language==='en'?['B','KB','MB','GB','TB']:['Б','КБ','МБ','ГБ','ТБ'];while(n>=1000&&i<4){n/=1000;i++}

 }
 if(connecting){
 const stages={starting:'Подключаем…',starting_core:'Запускаем ядро…',creating_tunnel:'Создаём туннель…',configuring_system:'Настраиваем систему…',checking_access:'Проверяем доступ…'};
 el('state').textContent=stages[s.stage]||'Подключаем…';el('verb').textContent='Отменить';
 }

el('paste').onclick=()=>run(async()=>{const s=await api.paste();if(s.error){render(s);return}el('url').value=s.text.trim();el('note').textContent=''});
async function ready(backend){
 api=backend;
 try{setLanguage((await api.language(null)).name);applyPalette((await api.palette(null)).name);
 const s=await api.servers();if(s.names.length){el('nodes').replaceChildren(...s.names.map(n=>new Option(n,n)));loaded=true}
 await loadPreferences();await refreshFavorites();render(await api.snapshot())}finally{busy=false;controls()}
 setInterval(async()=>{if(busy||polling||Date.now()-lastPoll<(preferences.power_saving?5000:1000))return;lastPoll=Date.now();polling=true;try{const s=await api.snapshot();if(!busy)render(s)}finally{polling=false}},1000)
}
function bytes(n){let i=0;const units=['B','KB','MB','GB','TB'];while(n>=1000&&i<4){n/=1000;i++}return n.toFixed(i?1:0)+' '+units[i]}
async function loadPreferences(){
 preferences=await api.preferences(null);
 document.body.classList.toggle('private',preferences.presentation);
 el('privacyNotice').hidden=!preferences.presentation;
 el('url').type=preferences.presentation?'password':'url';
 el('privateServer').hidden=!preferences.presentation;
 el('privateServer').value=language==='en'?'Server hidden':'Сервер скрыт';
 el('nodes').hidden=!!preferences.presentation;
 document.querySelector('main').style.zoom=preferences.scale/100;
 el('auto_power').checked=preferences.auto_power;el('close_behavior').value=preferences.close_behavior;el('presentation').checked=preferences.presentation;el('power_saving').checked=preferences.power_saving;el('scale').value=preferences.scale;

}
el('disablePrivacy').onclick=async()=>{
 const result=await api.preferences({presentation:false});
 if(result.error){el('note').textContent=result.error;return}
 await loadPreferences();
};
for(const id of ['presentation','power_saving','scale','auto_power','close_behavior'])el(id).onchange=async()=>{
 const result=await api.preferences({[id]:id==='scale'?Number(el(id).value):id==='close_behavior'?el(id).value:el(id).checked});
 if(result.error){el('settingNote').textContent=result.error;return}await loadPreferences();
};
el('settingsSearch').oninput=()=>{
 const q=el('settingsSearch').value.toLocaleLowerCase().trim();
 let matches=0;
 for(const row of document.querySelectorAll('#extraSettings .setting-row')){
  const match=(row.textContent+' '+row.dataset.search).toLocaleLowerCase().includes(q);
  row.hidden=!match;if(match)matches++;
 }
 for(const group of el('extraSettings').children)group.hidden=![...group.children].some(row=>!row.hidden);
 el('noSettings').hidden=matches>0;
};
async function refreshFavorites(){
 if(!loaded)return;
 const result=await api.favorite(null),selected=el('nodes').value;
 const options=[...el('nodes').options];
 options.sort((a,b)=>Number(result.names.includes(b.value))-Number(result.names.includes(a.value)));
 options.forEach(o=>{o.textContent=(result.names.includes(o.value)?'★ ':'')+o.value;el('nodes').append(o)});
 el('nodes').value=selected;el('favorite').textContent=result.names.includes(selected)?'★ Избранное':'☆ Избранное';
}
el('favorite').onclick=async()=>{if(!loaded)return;await api.favorite(el('nodes').value);await refreshFavorites()};
el('nodes').onchange=refreshFavorites;
el('undo').onclick=async()=>{const s=await api.undo();el('settingNote').textContent=s.error||'';await loadPreferences();await refreshFavorites()};
el('reset').onclick=async()=>{
 if(!confirm(language==='en'?'Disconnect and delete all Bridge data?':'Отключить VPN и удалить все данные Bridge?'))return;
 const s=await api.reset();if(s.error){el('settingNote').textContent=s.error;return}loaded=false;active=false;el('url').value='';el('nodes').replaceChildren(new Option('Загрузите подписку',''));el('history').replaceChildren();el('totals').textContent='';
 applyPalette('sage');setLanguage('ru');await loadPreferences();render(await api.snapshot());
};
el('settingsTab').onclick=async()=>{
 tab(true);const report=await api.report();
 el('totals').textContent=(language==='en'?'Today: ':'Сегодня: ')+bytes(report.today)+' · '+(language==='en'?'Month: ':'Месяц: ')+bytes(report.month);
 el('history').replaceChildren();
 for(const entry of report.history){const row=document.createElement('p');row.textContent=new Date(entry.started*1000).toLocaleString()+' · '+entry.server+' · '+bytes(entry.bytes);el('history').append(row)}
};
el('speed').onclick=()=>run(async()=>{
 if(!confirm(language==='en'?'Download up to 8 MiB from Cloudflare through this server? Network overhead is additional.':'Загрузить до 8 MiB через сервер с Cloudflare? Служебный трафик учитывается дополнительно.'))return;
 el('note').textContent=language==='en'?'Testing…':'Проверяем…';
 const result=await api.speed_test();
 el('note').textContent=result.error||(result.mbps.toFixed(1)+' Mbps · '+bytes(result.bytes));
});
controls();
if(window.BridgeNative){
 let seq=0;const waiting=new Map();
 window.bridgeReply=(id,result)=>{if(waiting.has(id)){waiting.get(id)(result);waiting.delete(id)}};
 ready(new Proxy({},{get:(_,method)=>(...args)=>new Promise(resolve=>{const id=++seq;waiting.set(id,resolve);BridgeNative.call(id,method,JSON.stringify(args))})}));
}else window.addEventListener('pywebviewready',()=>ready(pywebview.api));
</script></body></html>
